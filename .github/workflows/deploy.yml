name: Deploy to Railway

on:
  push:
    branches: [main]

permissions:
  contents: write   # job sync-branches butuh push ke staging/development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        run: |
          railway up \
            --project 07bd0bb5-148a-49bf-afe8-b03ad89d723e \
            --service 35010fd5-2e97-4a6a-8fca-536e3cbfa790 \
            --environment production \
            --detach
        working-directory: billiard-v2
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Setiap rilis ke main, samakan branch staging & development (fast-forward)
  # agar environment dev/staging ikut kode terbaru. Tidak memicu loop: workflow
  # ini hanya trigger pada push ke `main`, bukan staging/development.
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward staging & development ke main
        run: |
          git push origin HEAD:staging
          git push origin HEAD:development
